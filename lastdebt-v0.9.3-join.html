<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LAST DEBT — Join Game</title><style>*{box-sizing:border-box}html,body{margin:0;background:#06132e;color:#fff;font-family:system-ui,-apple-system,sans-serif}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center}.poster{position:relative}.poster>img{width:100%;height:100%;display:block}.toast{position:fixed;z-index:9;left:50%;bottom:10%;transform:translateX(-50%);padding:12px 17px;border-radius:12px;background:#092b4a;border:2px solid #69ffd5;font-weight:800}.toast[hidden]{display:none}</style><style>
.poster{height:min(100svh,150vw)!important;min-height:0!important;width:min(100vw,66.6667svh);aspect-ratio:2/3;overflow:hidden}.screen{overflow:auto!important}.hot{position:absolute;cursor:pointer;background:transparent;border:0;touch-action:manipulation}.hot:focus-visible{outline:3px solid #fff}.overlay{position:absolute;display:flex;align-items:center;justify-content:center;color:white;text-shadow:0 0 9px #21aaff;font-weight:900}.snowfield{background:linear-gradient(#04132b,#061d43);border:2px solid #5ad4ff;box-shadow:inset 0 0 13px #118aff99,0 0 5px #06cfff;border-radius:9px}.snowfield:focus{outline:2px solid white}.toast{max-width:90vw;white-space:normal!important;text-align:center}input{font-family:inherit} 
</style></head><body><main class="screen"><div class="poster"><img src="lastdebt-join-clean.webp" alt="Illustrated snowman Join Game screen"><a class="hot" href="lastdebt-v0.9.3-online.html" style="left:1%;top:1%;width:28%;height:6%" aria-label="Back to Play Online"></a>
<div id="boxes" style="position:absolute;left:24%;top:34.65%;width:52%;height:7.3%;display:flex;gap:1.5%;align-items:stretch;pointer-events:none"></div>
<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Enter six digit room code" style="position:absolute;left:24%;top:34.65%;width:52%;height:7.3%;opacity:0.015;font-size:16px;cursor:text" />
<button id="join" class="hot" style="left:24%;top:47.2%;width:52%;height:9.7%" aria-label="Join Game"></button>
<input id="name" maxlength="16" autocomplete="nickname" aria-label="Your snowman name" class="snowfield" placeholder="Your name" style="position:absolute;left:39%;top:62.5%;width:34%;height:4.3%;font-size:clamp(12px,3.1vw,22px);text-align:center;color:white;outline:none" />
</div></main><div class="toast" id="toast" hidden></div><script>
const el=id=>document.getElementById(id);function toast(t){el('toast').textContent=t;el('toast').hidden=false;clearTimeout(window.t);window.t=setTimeout(()=>el('toast').hidden=true,2600)}
const c=el('code'),n=el('name');n.value=localStorage.getItem('lastdebt-name')||'';for(let i=0;i<6;i++){const d=document.createElement('div');d.className='snowfield';d.style.cssText='flex:1;min-width:0;display:grid;place-items:center;font-size:clamp(17px,4.2vw,29px);color:#fff';el('boxes').append(d)}
function paint(){[...el('boxes').children].forEach((b,i)=>b.textContent=c.value[i]||'')}c.addEventListener('input',()=>{c.value=c.value.replace(/\D/g,'').slice(0,6);paint()});el('boxes').onclick=()=>c.focus();el('join').onclick=()=>{if(!/^\d{6}$/.test(c.value)){toast('Enter a six-digit room code');c.focus();return}if(!n.value.trim()){toast('Enter your snowman name');n.focus();return}localStorage.setItem('lastdebt-name',n.value.trim());toast('❄ Room joining requires an online server. Not connected yet!')};
</script></body></html>
