<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07112a"><title>LAST DEBT — Main Menu</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050c22;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a2654 0%,#050c22 72%);overflow:hidden}.poster{position:relative;flex:none;height:100svh;min-height:560px;aspect-ratio:2/3;box-shadow:0 0 70px #040716}.poster img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}.hit{position:absolute;left:23%;width:54%;height:6.8%;border:0;border-radius:12px;cursor:pointer;background:transparent;color:transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.hit:focus-visible{outline:4px solid #fff;outline-offset:3px;background:#ffffff21}.hit:active{background:#ffffff28}.play{top:55.1%}.cards{top:63.3%}.how{top:71.1%}.settings{top:79.2%}.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:10;background:#020717b8;display:grid;place-items:center;padding:20px;backdrop-filter:blur(7px)}.panel{width:min(92vw,420px);padding:28px;text-align:center;border:2px solid #61baff;border-radius:20px;background:linear-gradient(150deg,#122653,#080f26);box-shadow:0 0 35px #268aff77}.panel h2{margin:0 0 12px;font-size:28px}.panel p{line-height:1.5;color:#d7e7ff}.close{margin-top:12px;padding:13px 32px;border:2px solid #8ae8ff;border-radius:12px;background:#07316b;color:white;font-weight:900;font-size:17px;cursor:pointer}@media(prefers-reduced-motion:no-preference){.hit{transition:background .12s}}@media(max-height:560px){.screen{align-items:flex-start}} </style></head>
<body><main class="screen"><div class="poster"><img src="lastdebt-menu.webp" alt="LAST DEBT main menu with six magical snowman cards, snowy arena, and four menu buttons" fetchpriority="high">
<button class="hit play" aria-label="Play" data-action="play"></button>
<a class="hit cards" aria-label="All Cards — view card descriptions" href="lastdebt-v0.6-cards.html"></a>
<button class="hit how" aria-label="How to Play" data-action="how"></button>
<button class="hit settings" aria-label="Settings" data-action="settings"></button>
</div></main><div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="panel"><h2 id="modalTitle">COMING SOON</h2><p id="modalBody">This feature is coming soon.</p><button class="close" id="close">BACK TO MENU</button></div></div>
<script>
const modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),body=document.getElementById('modalBody'),close=document.getElementById('close');let previous=null;
const messages={play:['PLAY','The multiplayer game is coming soon! For now, explore all six cards.'],how:['HOW TO PLAY','The full game rules page is coming next!'],settings:['SETTINGS','Settings will be added in a future version.']};
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{previous=b;const m=messages[b.dataset.action];title.textContent=m[0];body.textContent=m[1];modal.hidden=false;close.focus()}));
function dismiss(){modal.hidden=true;previous?.focus()}close.addEventListener('click',dismiss);modal.addEventListener('click',e=>{if(e.target===modal)dismiss()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)dismiss()});
</script></body></html>
