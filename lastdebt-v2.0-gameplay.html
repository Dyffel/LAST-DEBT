<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LAST DEBT — Online Arena</title><style>
*{box-sizing:border-box}body{margin:0;color:#eefaff;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;background:linear-gradient(#041025bb,#041025e8),url('lastdebt-arena-backdrop.webp') center/cover fixed}.wrap{max-width:920px;margin:auto;padding:15px 10px 45px}h1{text-align:center;font-size:clamp(20px,5vw,34px);margin:8px 0;color:#d4f4ff;text-shadow:0 0 15px #1abaff}.sub{text-align:center;color:#b9dfff;font-size:13px;margin-bottom:14px}.players{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.player{background:#06142be8;border:2px solid #627a9b;border-radius:15px;padding:12px 5px;text-align:center;min-width:0}.player.turn{border-color:#53d7ff;box-shadow:0 0 16px #19c5ff88}.player.me{background:#0c2544e8}.player.escaped{border-color:#f3d279}.player strong{display:block;overflow:hidden;text-overflow:ellipsis;font-size:clamp(12px,3vw,17px)}.debt{font-size:clamp(30px,7vw,48px);font-weight:1000}.tag{font-size:10px;color:#91e8ff}.panel{margin:12px 0;background:#07132de8;border:2px solid #517ca1;border-radius:17px;padding:13px}.status{text-align:center;font-weight:900;font-size:18px}.log{text-align:center;color:#bce7ff;min-height:40px;padding:8px}.deck{display:flex;justify-content:center;gap:18px;font-size:13px;color:#c9dff0}.hand{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:12px 0}.card{width:32%;max-width:200px;min-width:0;flex-shrink:0;background:#07142a;border:3px solid #58c5ff;border-radius:12px;overflow:hidden;color:white;cursor:pointer}.card.selected{border-color:#ffdf76;transform:translateY(-5px)}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.card b{display:block;padding:8px 3px;font-size:12px}.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px}.controls select,.controls input{background:#091c38;color:white;border:2px solid #7dc7f5;border-radius:9px;padding:10px;font-size:16px;max-width:100%}button.action{background:linear-gradient(#16855a,#075238);border:2px solid #62ffbb;border-radius:11px;padding:12px 17px;color:white;font-weight:900;min-height:45px}button.action:disabled{opacity:.4}.alt{background:linear-gradient(#23507c,#0a2142)!important;border-color:#8bcfff!important}.danger{background:#7a2332!important;border-color:#ff7c83!important}.hidden{display:none!important}.warning{color:#ffb1b1;text-align:center;min-height:23px;font-size:13px}.overlay{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:5;padding:16px}.modal{background:linear-gradient(#123858,#071329);border:3px solid #8fd9ff;border-radius:20px;max-width:470px;width:100%;padding:22px;text-align:center;box-shadow:0 0 35px #16aaff77}.result{padding:9px;border-bottom:1px solid #ffffff22}.modal button{margin:8px}.reaction{border-color:#ffb54e;text-align:center}.reaction h2{color:#ffe3a0}.small{font-size:12px;color:#bdd9ed}.toplink{color:#9bdcff;font-size:12px}#loading{text-align:center;padding:25px}
</style></head><body><main class="wrap"><h1>❄ LAST DEBT · ONLINE ARENA ❄</h1><div class="sub" id="roomLabel">Connecting…</div><div id="loading">Connecting to the three-player match…</div><div id="game" class="hidden"><section class="players" id="players"></section><section class="panel"><div class="status" id="turnLabel"></div><div class="log" id="log"></div><div class="deck"><span id="drawCount"></span><span id="discardCount"></span></div></section><section id="reaction" class="panel reaction hidden"><h2>🛡️ INCOMING THIEF!</h2><p id="reactionText"></p><div class="controls"><button id="shieldYes" class="action">USE SHIELD</button><button id="shieldNo" class="action danger">TAKE +5 DEBT</button></div></section><section class="panel"><div class="status">🃏 YOUR PRIVATE HAND <span id="handCount"></span></div><div class="hand" id="hand"></div><div class="controls"><select id="target" aria-label="Choose target"></select><label id="betLabel" class="hidden">Bet <input id="bet" type="number" value="11" min="11" max="20" style="width:76px"></label><button id="play" class="action">PLAY CARD</button><button id="replace" class="action alt">🔄 REPLACE CARD</button></div><p class="warning" id="notice"></p><p class="small" style="text-align:center">One card is drawn automatically at the start of your turn when you have fewer than three cards. SHIELD works only during a THIEF attack.</p></section></div><div id="end" class="overlay hidden"><div class="modal"><h2>🏆 MATCH OVER 🏆</h2><div id="results"></div><p id="votes"></p><button id="rematch" class="action">🔄 VOTE REMATCH</button><button id="view" class="action alt">VIEW BOARD</button></div></div><button id="reopen" class="action alt hidden">🏆 VIEW RESULTS</button><p style="text-align:center"><a class="toplink" href="lastdebt-v0.9.3.html">← Main menu</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="lastdebt-supabase.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const code=new URLSearchParams(location.search).get('room')||sessionStorage.getItem('lastdebt-room-code');let myId,state,selected=-1,busy=false,lastMatch=null,poll=null,overlayDismissed=false;const names={relief:'RELIEF',thief:'THIEF',shield:'SHIELD',mirror:'MIRROR',gamble:'GAMBLE',bounty:'BOUNTY'};const colors={relief:'#0dff9b',thief:'#ff6666',shield:'#45c5ff',mirror:'#cb83ff',gamble:'#ffc658',bounty:'#ff984c'};
function msg(t){$('notice').textContent=t}function me(){return state?.players?.find(p=>p.user_id===myId)}function mine(){return state?.turn_user_id===myId&&state.status==='playing'&&!state.pending_action}function playable(c){const d=me()?.debt||0;return c==='relief'?d>0:c==='gamble'?d>=11&&d<=89:['thief','mirror','bounty'].includes(c)}function targetNeeded(c){return ['thief','mirror','bounty'].includes(c)}
function paint(s){if(!s)return;state=s;$('loading').classList.add('hidden');$('game').classList.remove('hidden');if(lastMatch!==s.match_id){lastMatch=s.match_id;selected=-1;overlayDismissed=false}$('roomLabel').textContent='ROOM '+code+' · MATCH '+s.match_number;const turn=s.players.find(p=>p.user_id===s.turn_user_id);$('turnLabel').textContent=s.status==='finished'?'🏆 MATCH COMPLETE':(turn?.name||'Player')+"'s turn"+(mine()?' — YOU!':'');$('log').textContent=s.last_action||'';$('drawCount').textContent='🃏 Deck: '+s.draw_count;$('discardCount').textContent='♻ Discard: '+s.discard_count;
$('players').replaceChildren();s.players.forEach(p=>{const d=document.createElement('div');d.className='player'+(p.user_id===s.turn_user_id?' turn':'')+(p.user_id===myId?' me':'')+(p.escaped?' escaped':'');const a=document.createElement('div');a.textContent=p.escaped?'🏆':'☃️';a.style.fontSize='29px';const n=document.createElement('strong');n.textContent=p.name+(p.user_id===myId?' (YOU)':'');const debt=document.createElement('div');debt.className='debt';debt.textContent=p.debt;const label=document.createElement('div');label.className='tag';label.textContent=p.escaped?'ESCAPED':p.bounty_owner?'🎯 BOUNTY · '+p.hand_count+' cards':p.hand_count+' cards';d.append(a,n,debt,label);$('players').append(d)});
$('hand').replaceChildren();const hand=s.my_hand||[];hand.forEach((c,i)=>{const b=document.createElement('button');b.className='card'+(selected===i?' selected':'');b.style.borderColor=selected===i?'#ffe18d':colors[c];const im=document.createElement('img');im.src='lastdebt-'+c+'.webp';im.alt=names[c]||c;const t=document.createElement('b');t.textContent=names[c]||c;b.append(im,t);b.onclick=()=>{selected=i;paint(state)};$('hand').append(b)});$('handCount').textContent='('+hand.length+'/3)';
const card=hand[selected];const target=$('target');const old=target.value;target.replaceChildren();s.players.filter(p=>p.user_id!==myId&&!p.escaped).forEach(p=>{const opt=document.createElement('option');opt.value=p.user_id;opt.textContent=p.name+' ('+p.debt+' debt)';target.append(opt)});if([...target.options].some(o=>o.value===old))target.value=old;target.classList.toggle('hidden',!targetNeeded(card));$('betLabel').classList.toggle('hidden',card!=='gamble');$('play').disabled=busy||!mine()||!card||!playable(card);const stuck=hand.length>0&&!hand.some(playable);$('replace').classList.toggle('hidden',!mine()||!stuck||me()?.replaced_this_turn);$('replace').disabled=busy||selected<0;const pending=s.pending_action;const isTarget=pending?.target===myId;const deadline=s.pending_deadline?new Date(s.pending_deadline).getTime():0;const remain=deadline?Math.max(0,Math.ceil((deadline-Date.now())/1000)):null;$('reaction').classList.toggle('hidden',!isTarget);if(isTarget){$('reactionText').textContent='You are targeted! '+(remain!==null?remain+' seconds left.':'React now.');$('shieldYes').disabled=busy||!hand.includes('shield')||remain===0;$('shieldNo').disabled=busy||remain===0;}$('notice').textContent=busy?'Sending action…':s.status==='finished'?'Vote for a rematch.':pending?(isTarget?'Choose SHIELD or accept THIEF.':'Waiting for THIEF reaction…'):mine()?stuck?'No playable cards: select one and REPLACE.':card&&!playable(card)?'That card cannot be played now.':'Choose a card to play.':'Waiting for your turn.';
const finished=s.status==='finished';$('reopen').classList.toggle('hidden',!finished);if(finished){const loser=s.players.find(p=>p.user_id===s.loser_user_id);$('results').replaceChildren();(s.escape_order||[]).forEach((id,i)=>{const p=s.players.find(x=>x.user_id===id);const r=document.createElement('div');r.className='result';r.textContent=(i===0?'🥇':'🥈')+' '+(p?.name||'Player')+' — ESCAPED';$('results').append(r)});if(loser){const r=document.createElement('div');r.className='result';r.textContent='💀 '+loser.name+' — '+loser.debt+' PUSH-UPS';$('results').append(r)}$('votes').textContent=s.players.filter(p=>p.rematch_ready).length+'/3 voted to rematch';$('rematch').textContent=me()?.rematch_ready?'✓ VOTED — CANCEL?':'🔄 VOTE REMATCH';$('end').classList.toggle('hidden',overlayDismissed)}else $('end').classList.add('hidden');}
async function action(fn,args){if(busy)return;busy=true;try{const s=await ldRpc(fn,args);paint(s)}catch(e){msg('⚠ '+ldMessage(e))}finally{busy=false}}
$('play').onclick=()=>{if(!mine()||selected<0)return;const card=state.my_hand[selected];if(!playable(card))return;const args={p_room_code:code,p_card:card,p_target_user_id:targetNeeded(card)?$('target').value:null,p_bet:null};if(card==='gamble'){const bet=Number($('bet').value),debt=me().debt;if(!Number.isInteger(bet)||bet<11||bet>20||bet>debt||debt+bet>100){msg('GAMBLE: bet 11–20, cannot exceed your debt or 100 after losing.');return}args.p_bet=bet}selected=-1;action('play_card',args)};
$('replace').onclick=()=>{if(selected<0)return;const c=state.my_hand[selected];selected=-1;action('replace_card',{p_room_code:code,p_card:c})};$('shieldYes').onclick=()=>action('respond_shield',{p_room_code:code,p_use_shield:true});$('shieldNo').onclick=()=>action('respond_shield',{p_room_code:code,p_use_shield:false});$('rematch').onclick=()=>action('vote_rematch',{p_room_code:code,p_ready:!me()?.rematch_ready});$('view').onclick=()=>{overlayDismissed=true;$('end').classList.add('hidden')};$('reopen').onclick=()=>{overlayDismissed=false;$('end').classList.remove('hidden')};
async function refresh(){if(busy||!code)return;try{let s=await ldRpc('get_game_state',{p_room_code:code});if(s.pending_action&&s.pending_deadline&&Date.now()>=new Date(s.pending_deadline).getTime()){s=await ldRpc('resolve_shield_timeout',{p_room_code:code})}paint(s)}catch(e){$('loading').textContent='Connection / game error: '+ldMessage(e)}}
async function init(){if(!/^\d{6}$/.test(code||'')){$('loading').textContent='Missing room code. Join or create a room first.';return}try{const c=await ldClient();const {data:{user}}=await c.auth.getUser();myId=user.id;sessionStorage.setItem('lastdebt-room-code',code);await refresh();poll=setInterval(refresh,1500)}catch(e){$('loading').textContent='Connection failed: '+ldMessage(e)}}window.addEventListener('pagehide',()=>clearInterval(poll));init();})();
</script></body></html>
