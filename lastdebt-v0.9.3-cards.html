<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06112a"><title>LAST DEBT — All Cards v0.9.5</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06112a;color:white;font-family:system-ui,-apple-system,Arial,sans-serif}body{overflow-x:hidden}.poster{position:relative;width:min(100%,720px);aspect-ratio:2/3;margin:0 auto;container-type:inline-size;--active:#00f981}.scene{display:block;width:100%;height:100%;pointer-events:none;user-select:none}.home{position:absolute;left:68%;top:1.4%;width:30%;height:7%;z-index:3}.home:focus-visible,.pick:focus-visible{outline:3px solid white;outline-offset:2px}.hero{position:absolute;left:30%;top:12.1%;width:40%;height:15.5%;border-radius:2cqw;overflow:hidden;display:flex;flex-direction:column;background:#071027;box-shadow:0 0 2cqw var(--glow)}.hero img{width:100%;height:82%;object-fit:cover;display:block}.hero strong{height:18%;display:grid;place-items:center;background:#050a13;font-size:3.2cqw;text-shadow:0 0 1cqw var(--glow)}
/* Opaque wooden inset masks the artwork's pre-drawn horizontal guidelines. */
.info{position:absolute;left:20%;top:33.5%;width:60%;height:22.2%;padding:1.2cqw 1.6cqw;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(145deg,rgba(7,21,42,.97),rgba(8,24,45,.97));border-radius:1cqw;scrollbar-width:thin;scrollbar-color:#6cc9ec transparent}.info h1{font-size:4.4cqw;line-height:1.1;margin:0 0 .7cqw;text-shadow:0 0 1cqw var(--active)}.badge{display:inline-block;background:var(--active);color:#041624;border-radius:.7cqw;padding:.5cqw 1cqw;font-weight:900;font-size:1.9cqw}.lead{font-size:2.4cqw;line-height:1.35;margin:1.1cqw 0}.rule{display:flex;gap:1cqw;align-items:flex-start;padding:.7cqw 0;border-top:1px solid #5e8ea65c;font-size:2.05cqw;line-height:1.35}.num{flex:0 0 2.7cqw;width:2.7cqw;height:2.7cqw;border-radius:50%;background:var(--active);color:#061321;font-size:1.7cqw;font-weight:900;display:grid;place-items:center}.example{margin-top:.5cqw;padding-top:.9cqw;border-top:1px solid #6a9db36b;font-size:2cqw;line-height:1.35}.example b{display:block;color:#bceeff;font-size:1.85cqw;letter-spacing:.07em;margin-bottom:.4cqw}.example p{margin:0 0 .4cqw}.info:after{content:"";display:block;height:.2cqw}
.deck{position:absolute;left:18%;top:60.4%;width:64%;height:24.9%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.3cqw 2.2cqw}.pick{border:0;padding:0;background:#061025;color:#fff;min-width:0;min-height:0;cursor:pointer;border-radius:1.4cqw;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 1.5cqw var(--glow);-webkit-tap-highlight-color:transparent;touch-action:manipulation}.pick img{display:block;width:100%;height:81%;object-fit:cover;min-height:0}.pick strong{display:grid;place-items:center;flex:1;width:100%;background:#060b16;font-size:2.1cqw;line-height:1}.pick.active{outline:.65cqw solid #f5ffff;outline-offset:-.4cqw;box-shadow:0 0 2cqw var(--glow),inset 0 0 1.5cqw var(--glow)}.pick:active{filter:brightness(1.2)}
/* The illustration ends naturally: no duplicated detail section or blue gap. */
@media(min-width:721px){body{background:radial-gradient(ellipse at center,#14385a,#06112a 65%)}.poster{box-shadow:0 0 60px #0008}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main class="poster" aria-label="All Cards"><img class="scene" src="lastdebt-cards-clean.webp" alt="Snowy village, aurora, snowman and six icy card slots"><a class="home" href="lastdebt-v0.9.3.html" aria-label="Back to main menu"></a><div class="hero" id="hero" style="--glow:#00f981"><img id="heroArt" src="lastdebt-relief.webp" alt="RELIEF snowman card"><strong id="heroName">RELIEF</strong></div><section class="info" id="info" aria-label="Selected card rules" tabindex="0"><h1 id="title">RELIEF</h1><span class="badge" id="badge">SELF CARD</span><p class="lead" id="lead"></p><div id="rules"></div><div class="example"><b>EXAMPLE</b><p id="exampleText"></p></div></section><nav class="deck" aria-label="Choose a card"><button class="pick" style="--glow:#00f981" data-card="relief" type="button" aria-label="View RELIEF card" aria-pressed="false"><img src="lastdebt-relief.webp" alt="" loading="lazy"><strong>RELIEF</strong></button><button class="pick" style="--glow:#ff423c" data-card="thief" type="button" aria-label="View THIEF card" aria-pressed="false"><img src="lastdebt-thief.webp" alt="" loading="lazy"><strong>THIEF</strong></button><button class="pick" style="--glow:#31baff" data-card="shield" type="button" aria-label="View SHIELD card" aria-pressed="false"><img src="lastdebt-shield.webp" alt="" loading="lazy"><strong>SHIELD</strong></button><button class="pick" style="--glow:#bb55ff" data-card="mirror" type="button" aria-label="View MIRROR card" aria-pressed="false"><img src="lastdebt-mirror.webp" alt="" loading="lazy"><strong>MIRROR</strong></button><button class="pick" style="--glow:#ffbf32" data-card="gamble" type="button" aria-label="View GAMBLE card" aria-pressed="false"><img src="lastdebt-gamble.webp" alt="" loading="lazy"><strong>GAMBLE</strong></button><button class="pick" style="--glow:#ff8d27" data-card="bounty" type="button" aria-label="View BOUNTY card" aria-pressed="false"><img src="lastdebt-bounty.webp" alt="" loading="lazy"><strong>BOUNTY</strong></button></nav></main><script>const DATA={"relief":{"name":"RELIEF","color":"#00f981","image":"lastdebt-relief.webp","type":"SELF CARD","summary":"Remove 4 push-ups from your debt.","rules":["Play RELIEF on your turn.","Reduce your own debt by 4 push-ups."],"example":"You have 10 push-ups. Play RELIEF → 10 − 4 = 6."},"thief":{"name":"THIEF","color":"#ff423c","image":"lastdebt-thief.webp","type":"ATTACK CARD","summary":"Give 5 push-ups to another player.","rules":["Play THIEF and choose another active player.","Your target receives 5 additional push-ups.","The target may react with SHIELD to block the attack."],"example":"Noel has 10 push-ups. You play THIEF on him → Noel now has 15."},"shield":{"name":"SHIELD","color":"#31baff","image":"lastdebt-shield.webp","type":"DEFENCE CARD","summary":"Block a card targeting you.","rules":["Keep SHIELD hidden in your hand.","Reveal SHIELD when another player targets you with an attack."],"example":"Noel plays THIEF on you. You reveal SHIELD → the attack is blocked."},"mirror":{"name":"MIRROR","color":"#bb55ff","image":"lastdebt-mirror.webp","type":"SPECIAL CARD","summary":"Swap your entire debt with another player.","rules":["Choose another active player.","Exchange your total push-up debts.","The target may use SHIELD to stop the swap."],"example":"You have 30 and Noel has 4. After MIRROR → you have 4; Noel has 30."},"gamble":{"name":"GAMBLE","color":"#ffbf32","image":"lastdebt-gamble.webp","type":"SPECIAL CARD","summary":"Risk your push-ups for a chance to reduce your debt.","rules":["Choose a bet from 1 to 20 push-ups, limited by your current debt and the 100-debt cap.","WIN (50%): subtract your bet from your debt.","LOSE (50%): add your bet to your debt."],"example":"You have 15 and bet 10. WIN → 15 − 10 = 5. LOSE → 15 + 10 = 25. At 81 debt, the maximum bet is 19."},"bounty":{"name":"BOUNTY","color":"#ff8d27","image":"lastdebt-bounty.webp","type":"SPECIAL CARD","summary":"Benefit when another player reduces their debt.","rules":["Place BOUNTY on another active player.","The next time they reduce debt, remove twice that amount from yours; BOUNTY then disappears.","The target can block BOUNTY with SHIELD when you play it."],"example":"You place BOUNTY on Noel. He plays RELIEF (−4) → you remove 8 push-ups."}};const picks=[...document.querySelectorAll('.pick')];function showCard(id){const c=DATA[id];if(!c)return;document.querySelector('.poster').style.setProperty('--active',c.color);document.getElementById('hero').style.setProperty('--glow',c.color);document.getElementById('heroArt').src=c.image;document.getElementById('heroArt').alt=c.name+' snowman card';document.getElementById('heroName').textContent=c.name;document.getElementById('title').textContent=c.name;document.getElementById('badge').textContent=c.type;document.getElementById('lead').textContent=c.summary;document.getElementById('exampleText').textContent=c.example;const rules=document.getElementById('rules');rules.replaceChildren();c.rules.forEach((rule,i)=>{const row=document.createElement('div');row.className='rule';const n=document.createElement('span');n.className='num';n.textContent=i+1;const t=document.createElement('span');t.textContent=rule;row.append(n,t);rules.append(row)});document.getElementById('info').scrollTop=0;picks.forEach(b=>{const active=b.dataset.card===id;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}picks.forEach(b=>b.addEventListener('click',()=>showCard(b.dataset.card)));showCard('relief');</script></body></html>
