*{box-sizing:border-box}html,body{margin:0;background:#06112a;color:white;font-family:system-ui,-apple-system,Arial,sans-serif}body{overflow-x:hidden}.poster{position:relative;width:min(100%,720px);margin:auto;aspect-ratio:2/3;container-type:inline-size;background:#07152f}.scene{display:block;width:100%;height:100%;user-select:none;pointer-events:none}.home{position:absolute;left:69%;top:1.5%;width:29%;height:7%;border:0;background:transparent;cursor:pointer;z-index:3}.home:focus-visible,.pick:focus-visible{outline:3px solid white;outline-offset:2px}.hero{position:absolute;left:30.3%;top:11.2%;width:39.6%;height:16.3%;display:flex;flex-direction:column;overflow:hidden;border-radius:1.5cqw;box-shadow:0 0 2.5cqw var(--glow)}.hero img{display:block;width:100%;height:82%;object-fit:cover}.hero strong{display:grid;place-items:center;height:18%;font-size:3.3cqw;text-shadow:0 0 1cqw var(--glow);background:#040b18}.info{position:absolute;left:20.5%;top:33.1%;width:59%;height:22.5%;overflow:hidden;padding:.4cqw 1cqw;display:flex;flex-direction:column;gap:.6cqw}.info h1{font-size:3.8cqw;margin:0;line-height:1.08;text-shadow:0 0 1.2cqw var(--active)}.badge{align-self:flex-start;background:var(--active);color:#031524;font-weight:900;font-size:1.7cqw;padding:.5cqw 1.2cqw;border-radius:.6cqw}.lead{font-size:2.1cqw;margin:.3cqw 0;line-height:1.25}.rules{display:flex;flex-direction:column;gap:.3cqw;min-height:0}.rule{display:flex;gap:1cqw;align-items:flex-start;font-size:1.75cqw;line-height:1.25;padding:.35cqw 0}.num{flex:0 0 2.5cqw;height:2.5cqw;display:grid;place-items:center;border-radius:50%;background:var(--active);color:#041426;font-weight:900;font-size:1.6cqw}.example{margin-top:auto;font-size:1.75cqw;line-height:1.25}.example b{display:block;color:#9fe8ff;margin-bottom:.3cqw;font-size:1.9cqw}.example p{margin:0}.deck{position:absolute;left:18.3%;top:60.9%;width:64.1%;height:24.7%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);column-gap:5. </style></head><body><main class="poster"><img class="scene" src="lastdebt-cards-clean.webp" alt="Snowy village with illustrated card displays"><a class="home" href="lastdebt-v0.9.3.html" aria-label="Back to main menu"></a><div class="hero" id="hero" style="--glow:#00f981"><img id="heroArt" src="lastdebt-relief.webp" alt="RELIEF snowman card"><strong id="heroName">RELIEF</strong></div><section class="info" aria-live="polite"><h1 id="title">RELIEF</h1><span class="badge" id="badge">SELF CARD</span><p class="lead" id="lead">Remove 4 push-ups from your debt.</p><div class="rules" id="rules"></div><div class="example"><b>EXAMPLE</b><p id="exampleText"></p></div></section><nav class="deck" aria-label="Select a card">

</nav></main><script>const DATA={"relief":{"name":"RELIEF","color":"#00f981","image":"lastdebt-relief.webp","type":"SELF CARD","summary":"Remove 4 push-ups from your debt.","rules":["Play RELIEF on your turn.","Reduce your own debt by 4 push-ups."],"example":"You have 10 push-ups. Play RELIEF → 10 − 4 = 6."},"thief":{"name":"THIEF","color":"#ff423c","image":"lastdebt-thief.webp","type":"ATTACK CARD","summary":"Give 5 push-ups to another player.","rules":["Play THIEF and choose another active player.","Your target receives 5 additional push-ups.","The target may react with SHIELD to block the attack."],"example":"Noel has 10 push-ups. You play THIEF on him → Noel now has 15."},"shield":{"name":"SHIELD","color":"#31baff","image":"lastdebt-shield.webp","type":"DEFENCE CARD","summary":"Block a card targeting you.","rules":["Keep SHIELD hidden in your hand.","Reveal SHIELD when another player targets you with an attack."],"example":"Noel plays THIEF on you. You reveal SHIELD → the attack is blocked."},"mirror":{"name":"MIRROR","color":"#bb55ff","image":"lastdebt-mirror.webp","type":"SPECIAL CARD","summary":"Swap your entire debt with another player.","rules":["Choose another active player.","Exchange your total push-up debts.","The target may use SHIELD to stop the swap."],"example":"You have 30 and Noel has 4. After MIRROR → you have 4; Noel has 30."},"gamble":{"name":"GAMBLE","color":"#ffbf32","image":"lastdebt-gamble.webp","type":"SPECIAL CARD","summary":"Risk your push-ups for a chance to reduce your debt.","rules":["Choose a bet from 1 to 20 push-ups, limited by your current debt and the 100-debt cap.","WIN (50%): subtract your bet from your debt.","LOSE (50%): add your bet to your debt."],"example":"You have 15 and bet 10. WIN → 15 − 10 = 5. LOSE → 15 + 10 = 25. At 81 debt, the maximum bet is 19."},"bounty":{"name":"BOUNTY","color":"#ff8d27","image":"lastdebt-bounty.webp","type":"SPECIAL CARD","summary":"Benefit when another player reduces their debt.","rules":["Place BOUNTY on another active player.","The next time they reduce debt, remove twice that amount from yours; BOUNTY then disappears.","The target can block BOUNTY with SHIELD when you play it."],"example":"You place BOUNTY on Noel. He plays RELIEF (−4) → you remove 8 push-ups."}};
const picks=[...document.querySelectorAll('.pick')];function showCard(id){const c=DATA[id];if(!c)return;document.documentElement.style.setProperty('--active',c.color);document.getElementById('hero').style.setProperty('--glow',c.color);document.getElementById('heroArt').src=c.image;document.getElementById('heroArt').alt=c.name+' snowman card';document.getElementById('heroName').textContent=c.name;document.getElementById('title').textContent=c.name;document.getElementById('badge').textContent=c.type;document.getElementById('lead').textContent=c.summary;document.getElementById('exampleText').textContent=c.example;const rules=document.getElementById('rules');rules.replaceChildren();c.rules.forEach((rule,i)=>{const row=document.createElement('div');row.className='rule';const num=document.createElement('span');num.className='num';num.textContent=i+1;const txt=document.createElement('span');txt.textContent=rule;row.append(num,txt);rules.append(row)});picks.forEach(b=>{const active=b.dataset.card===id;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}picks.forEach(b=>b.addEventListener('click',()=>showCard(b.dataset.card)));showCard('relief');</script></body></html>
