<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST DEBT — All Cards</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 15% 70%, #65401c55, transparent 35%),
    radial-gradient(ellipse at 80% 10%, #183968, transparent 50%),
    linear-gradient(180deg, #061225, #101a32 65%, #1b1820);
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .3;
  background-image:
    radial-gradient(2px 2px at 15% 20%, white 50%, transparent),
    radial-gradient(2px 2px at 70% 40%, white 50%, transparent),
    radial-gradient(2px 2px at 35% 75%, white 50%, transparent);
  background-size: 140px 130px;
}

.page {
  width: min(1400px, 96%);
  margin: auto;
  padding: 25px 0 35px;
  position: relative;
}

h1 {
  text-align: center;
  margin: 0 0 25px;
  font-size: clamp(25px, 4vw, 43px);
  letter-spacing: 4px;
  color: #fff3ce;
  text-shadow: 0 0 18px #ffb64288;
}

.main {
  display: grid;
  grid-template-columns: 40% 1fr;
  gap: 35px;
  align-items: stretch;
}

.card {
  --color: #00ff88;
  position: relative;
  border: 4px solid var(--color);
  border-radius: 22px;
  overflow: hidden;
  background: #070e1b;
  box-shadow:
    0 0 12px var(--color),
    inset 0 0 14px var(--color);
  transition: transform .25s, box-shadow .25s;
}

.card.large {
  width: min(100%, 430px);
  margin: auto;
  aspect-ratio: 0.71;
  animation: appear .3s ease;
}

@keyframes appear {
  from { opacity: .5; transform: scale(.96); }
  to { opacity: 1; transform: scale(1); }
}

.art {
  height: 73%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 65%, var(--color), transparent 70%),
    #101525;
}

.art::before {
  content: "";
  position: absolute;
  width: 75%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 3px solid #ffffff33;
  box-shadow: 0 0 40px var(--color);
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  50% { transform: scale(1.08); opacity: .5; }
}

.symbol {
  position: relative;
  z-index: 1;
  font-size: clamp(90px, 13vw, 170px);
  filter: drop-shadow(0 8px 15px #000a);
}

.card-name {
  height: 27%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(#090c13, #03070e);
  font-size: clamp(24px, 4vw, 42px);
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--color);
}

.details {
  background: #030916df;
  border: 2px solid #30466b;
  border-radius: 24px;
  padding: clamp(20px, 3vw, 40px);
  display: flex;
  flex-direction: column;
}

.details h2 {
  margin: 0 0 12px;
  font-size: clamp(30px, 5vw, 55px);
  text-shadow: 0 0 15px var(--active);
}

.tag {
  background: var(--active);
  color: #06101c;
  font-size: 14px;
  font-weight: 900;
  border-radius: 7px;
  padding: 7px 13px;
  width: fit-content;
}

.summary {
  font-size: clamp(17px, 2vw, 23px);
  line-height: 1.45;
  padding: 18px 0;
  border-bottom: 1px solid #40516e;
}

.rules {
  flex: 1;
}

.rule {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 17px 0;
  border-bottom: 1px solid #34445c;
  font-size: clamp(15px, 1.7vw, 19px);
  line-height: 1.4;
}

.rule-number {
  flex-shrink: 0;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: var(--active);
  color: #06101c;
  display: grid;
  place-items: center;
  font-weight: 900;
}

.example {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 2px solid #34445c;
}

.example h3 {
  color: #b4b9ce;
  margin: 0 0 10px;
}

.example p {
  font-size: 17px;
  line-height: 1.6;
  margin: 0;
}

.deck {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 14px;
  margin-top: 38px;
}

.mini {
  padding: 0;
  cursor: pointer;
  color: inherit;
  border: 0;
  background: transparent;
  min-width: 0;
  font-family: inherit;
}

.mini .card {
  aspect-ratio: .72;
  border-width: 3px;
  border-radius: 13px;
  box-shadow: 0 0 5px var(--color);
  opacity: .76;
}

.mini .symbol {
  font-size: clamp(28px, 6vw, 75px);
}

.mini .card-name {
  font-size: clamp(10px, 1.5vw, 21px);
}

.mini.selected .card {
  opacity: 1;
  transform: translateY(-8px);
  box-shadow:
    0 0 12px var(--color),
    0 0 25px var(--color);
}

.mini:focus-visible {
  outline: 3px solid white;
  outline-offset: 5px;
  border-radius: 12px;
}

@media (max-width: 700px) {
  .main {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .card.large {
    width: min(70%, 290px);
  }

  .details {
    padding: 22px;
  }

  .deck {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .mini .symbol {
    font-size: 60px;
  }

  .mini .card-name {
    font-size: 15px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="page">
  <h1>LAST DEBT — ALL CARDS</h1>

  <div class="main">

    <div id="bigCard" class="card large">
      <div class="art">
        <div class="symbol" id="bigSymbol"></div>
      </div>
      <div class="card-name" id="bigCardName"></div>
    </div>

    <section class="details" id="details">
      <h2 id="title"></h2>
      <div class="tag" id="tag"></div>
      <div class="summary" id="summary"></div>

      <div class="rules" id="rules"></div>

      <div class="example">
        <h3>EXAMPLE</h3>
        <p id="example"></p>
      </div>
    </section>

  </div>

  <div class="deck" id="deck"></div>
</div>

<script>
const cards = [
  {
    id: "relief",
    name: "RELIEF",
    color: "#00ff88",
    symbol: "⬆",
    type: "SELF CARD",
    summary: "Remove 4 push-ups from your debt.",
    rules: [
      "Remove exactly 4 push-ups from your own debt.",
      "Cannot be challenged.",
      "Cannot be blocked by SHIELD."
    ],
    example:
      "You have 10 push-ups. You play RELIEF. Your debt decreases to 6."
  },

  {
    id: "thief",
    name: "THIEF",
    color: "#ff3535",
    symbol: "◆",
    type: "ATTACK CARD",
    summary: "Give 5 push-ups to another player.",
    rules: [
      "Choose a player and secretly play a card while claiming THIEF.",
      "The target may ACCEPT or CHALLENGE your claim.",
      "A correct challenge gives you +5. A wrong challenge gives the target +10 total."
    ],
    example:
      "You claim THIEF against Noel. Noel accepts. He receives +5 push-ups, even if you were bluffing."
  },

  {
    id: "shield",
    name: "SHIELD",
    color: "#27baff",
    symbol: "⬡",
    type: "DEFENCE CARD",
    summary: "Secretly block one card targeting you.",
    rules: [
      "Keep SHIELD hidden in your hand.",
      "Play it as a reaction when another player targets you.",
      "The attack is cancelled. Both cards are discarded."
    ],
    example:
      "Noel targets you with THIEF. You reveal SHIELD. His attack fails and neither debt changes."
  },

  {
    id: "mirror",
    name: "MIRROR",
    color: "#c342ff",
    symbol: "↔",
    type: "SPECIAL CARD",
    summary: "Swap your entire debt with another player.",
    rules: [
      "Choose another active player.",
      "Exchange your total push-up debts.",
      "Cannot be challenged, but SHIELD can block it."
    ],
    example:
      "You have 30 push-ups. Noel has 4. You play MIRROR. You now have 4 and Noel has 30."
  },

  {
    id: "gamble",
    name: "GAMBLE",
    color: "#ffbf30",
    symbol: "?",
    type: "SPECIAL CARD",
    summary: "Bet push-ups for a 50/50 chance to win or lose.",
    rules: [
      "Choose a bet from 1 to 20, limited by your debt and the 100-debt cap.",
      "WIN (50%): Remove your bet from your debt.",
      "LOSE (50%): Add your bet to your debt. Cannot be challenged."
    ],
    example:
      "You have 15 push-ups and bet 10. A win leaves you with 5; a loss leaves you with 25."
  },

  {
    id: "bounty",
    name: "BOUNTY",
    color: "#ff8c22",
    symbol: "◎",
    type: "SPECIAL CARD",
    summary: "Benefit when another player reduces their debt.",
    rules: [
      "Place a bounty on another active player.",
      "The next time they reduce debt, you remove DOUBLE that amount from yours. Then BOUNTY disappears.",
      "The target may block BOUNTY with SHIELD when it is played. Cannot be challenged."
    ],
    example:
      "You place BOUNTY on Noel. Noel plays RELIEF and removes 4. You remove 8 push-ups."
  }
];

const deck = document.getElementById("deck");

function selectCard(id) {
  const card = cards.find(c => c.id === id);
  if (!card) return;

  document.getElementById("bigCard").style.setProperty("--color", card.color);
  document.getElementById("bigSymbol").textContent = card.symbol;
  document.getElementById("bigCardName").textContent = card.name;

  const details = document.getElementById("details");
  details.style.setProperty("--active", card.color);

  document.getElementById("title").textContent = card.name;
  document.getElementById("tag").textContent = card.type;
  document.getElementById("summary").textContent = card.summary;
  document.getElementById("example").textContent = card.example;

  const rules = document.getElementById("rules");
  rules.replaceChildren();

  card.rules.forEach((text, index) => {
    const row = document.createElement("div");
    row.className = "rule";

    const number = document.createElement("span");
    number.className = "rule-number";
    number.textContent = index + 1;

    const description = document.createElement("span");
    description.textContent = text;

    row.append(number, description);
    rules.appendChild(row);
  });

  document.querySelectorAll(".mini").forEach(button => {
    const selected = button.dataset.id === id;
    button.classList.toggle("selected", selected);
    button.setAttribute("aria-pressed", String(selected));
  });
}

cards.forEach(card => {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "mini";
  button.dataset.id = card.id;
  button.setAttribute("aria-label", "View " + card.name);

  const cardElement = document.createElement("div");
  cardElement.className = "card";
  cardElement.style.setProperty("--color", card.color);

  const art = document.createElement("div");
  art.className = "art";

  const symbol = document.createElement("div");
  symbol.className = "symbol";
  symbol.textContent = card.symbol;

  const name = document.createElement("div");
  name.className = "card-name";
  name.textContent = card.name;

  art.appendChild(symbol);
  cardElement.append(art, name);
  button.appendChild(cardElement);

  button.addEventListener("click", () => selectCard(card.id));

  deck.appendChild(button);
});

selectCard("relief");
</script>

</body>
</html>
