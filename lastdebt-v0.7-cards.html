<button type="button" class="pick " data-card="thief" aria-pressed="false" aria-label="View THIEF card"><div class="card-frame" style="--glow:#ff423c"><img class="art" src="lastdebt-thief.webp" alt="THIEF snowman illustration" loading="lazy"><div class="nameplate">THIEF</div></div></button>
<button type="button" class="pick " data-card="shield" aria-pressed="false" aria-label="View SHIELD card"><div class="card-frame" style="--glow:#31baff"><img class="art" src="lastdebt-shield.webp" alt="SHIELD snowman illustration" loading="lazy"><div class="nameplate">SHIELD</div></div></button>
<button type="button" class="pick " data-card="mirror" aria-pressed="false" aria-label="View MIRROR card"><div class="card-frame" style="--glow:#bb55ff"><img class="art" src="lastdebt-mirror.webp" alt="MIRROR snowman illustration" loading="lazy"><div class="nameplate">MIRROR</div></div></button>

const DATA = {"relief":{"name":"RELIEF","color":"#00f981","image":"lastdebt-relief.webp","type":"SELF CARD","summary":"Remove 4 push-ups from your debt.","rules":["Play RELIEF on your turn.","Reduce your own debt by 4 push-ups."],"example":"You have 10 push-ups. Play RELIEF → 10 − 4 = 6."},"thief":{"name":"THIEF","color":"#ff423c","image":"lastdebt-thief.webp","type":"ATTACK CARD","summary":"Give 5 push-ups to another player.","rules":["Play THIEF and choose another active player.","Your target receives 5 additional push-ups.","The target may react with SHIELD to block the attack."],"example":"Noel has 10 push-ups. You play THIEF on him → Noel now has 15."},"shield":{"name":"SHIELD","color":"#31baff","image":"lastdebt-shield.webp","type":"DEFENCE CARD","summary":"Block a card targeting you.","rules":["Keep SHIELD hidden in your hand.","Reveal SHIELD when another player targets you with an attack."],"example":"Noel plays THIEF on you. You reveal SHIELD → the attack is blocked."},"mirror":{"name":"MIRROR","color":"#bb55ff","image":"lastdebt-mirror.webp","type":"SPECIAL CARD","summary":"Swap your entire debt with another player.","rules":["Choose another active player.","Exchange your total push-up debts.","The target may use SHIELD to stop the swap."],"example":"You have 30 and Noel has 4. After MIRROR → you have 4; Noel has 30."},"gamble":{"name":"GAMBLE","color":"#ffbf32","image":"lastdebt-gamble.webp","type":"SPECIAL CARD","summary":"Risk your push-ups for a chance to reduce your debt.","rules":["Choose a bet from 1 to 20 push-ups, limited by your current debt and the 100-debt cap.","WIN (50%): subtract your bet from your debt.","LOSE (50%): add your bet to your debt."],"example":"You have 15 and bet 10. WIN → 15 − 10 = 5. LOSE → 15 + 10 = 25. At 81 debt, the maximum bet is 19."},"bounty":{"name":"BOUNTY","color":"#ff8d27","image":"lastdebt-bounty.webp","type":"SPECIAL CARD","summary":"Benefit when another player reduces their debt.","rules":["Place BOUNTY on another active player.","The next time they reduce debt, remove twice that amount from yours; BOUNTY then disappears.","The target can block BOUNTY with SHIELD when you play it."],"example":"You place BOUNTY on Noel. He plays RELIEF (−4) → you remove 8 push-ups."}};
const picks=[...document.querySelectorAll('.pick')];
function showCard(id){
 const c=DATA[id];if(!c)return;
 document.documentElement.style.setProperty('--active',c.color);
 const art=document.getElementById('heroArt');art.src=c.image;art.alt=c.name+' snowman illustration';
 document.getElementById('heroFrame').style.setProperty('--glow',c.color);
 document.getElementById('heroName').textContent=c.name;
 document.getElementById('title').textContent=c.name;
 document.getElementById('badge').textContent=c.type;
 document.getElementById('lead').textContent=c.summary;
 document.getElementById('exampleText').textContent=c.example;
 const rules=document.getElementById('rules');rules.replaceChildren();
 c.rules.forEach((rule,i)=>{const row=document.createElement('div');row.className='rule';const number=document.createElement('span');number.className='num';number.textContent=i+1;const t=document.createElement('span');t.textContent=rule;row.append(number,t);rules.append(row)});
 picks.forEach(b=>{const active=b.dataset.card===id;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
}
picks.forEach(b=>b.addEventListener('click',()=>showCard(b.dataset.card)));
const snow=document.getElementById('snow');for(let i=0;i<28;i++){const s=document.createElement('i');s.className='flake';const z=2+(i*7)%4;s.style.cssText=`left:${(i*37)%100}%;width:${z}px;height:${z}px;animation-duration:${9+(i*3)%12}s;animation-delay:-${(i*11)%18}s`;snow.append(s)}
</script></body></html>
