<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06132e"><title>LAST DEBT — Join Room</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050c22;color:white;font-family:system-ui,-apple-system,sans-serif}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;background:radial-gradient(#1a2654,#050c22);overflow:hidden}.poster{position:relative;height:100svh;min-height:560px;aspect-ratio:2/3;flex:none;box-shadow:0 0 65px #000}.poster img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}.tap{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.tap:focus-visible,.entry:focus-visible{outline:3px solid #fff;outline-offset:3px}.back{left:1%;top:0%;width:30%;height:7%}.entry{position:absolute;text-align:center;border:2px solid #67cfff;border-radius:10px;background:#041536eb;color:white;font-weight:900;text-shadow:0 0 9px #22aaff;outline:none;min-width:0}.action{position:absolute;border:0;border-radius:12px;cursor:pointer;background:#00441a11;color:transparent;touch-action:manipulation}.action:active{background:#ffffff44}.toast{position:fixed;bottom:10%;left:50%;transform:translateX(-50%);padding:13px 20px;border:2px solid #7fffd0;border-radius:15px;background:#08263f;color:white;z-index:30;font-weight:900;white-space:nowrap;box-shadow:0 0 22px #09f8bd88}.toast[hidden]{display:none}.note{position:absolute;text-align:center;color:white;background:#071a39ed;border:2px solid #68caff;border-radius:10px;font-weight:800;line-height:1.2}@media(max-height:560px){.screen{align-items:flex-start}}
</style></head><body><main class="screen"><div class="poster"><img src="lastdebt-join.webp" alt="LAST DEBT Join Room snowy illustrated screen"><a class="tap back" href="lastdebt-v0.9.1-online.html" aria-label="Back to Play Online"></a>
<input id="roomCode" class="entry" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="••••••" autocomplete="one-time-code" aria-label="Six-digit room code" style="left:24%;top:34.7%;width:52%;height:7.2%;font-size:clamp(22px,6vh,42px);letter-spacing:.18em">
<button id="join" class="action" style="left:24%;top:47.4%;width:53%;height:10%" aria-label="Join Game"></button>
<input id="playerName" class="entry" maxlength="16" placeholder="Your name" aria-label="Your snowman name" style="left:40%;top:62.6%;width:33%;height:5.1%;font-size:clamp(14px,3vh,22px)"></div></main><div class="toast" id="toast" hidden></div><script>function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(window._tt);window._tt=setTimeout(()=>e.hidden=true,2600)}const n=document.getElementById('playerName');n.value=localStorage.getItem('lastdebt-name')||'';document.getElementById('roomCode').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6));document.getElementById('join').onclick=()=>{const code=document.getElementById('roomCode').value;if(!/^\d{6}$/.test(code)){toast('ENTER A 6-DIGIT CODE');return}if(!n.value.trim()){toast('ENTER YOUR NAME');n.focus();return}localStorage.setItem('lastdebt-name',n.value.trim());toast('❄ Online room joining needs a server — coming next!')};</script></body></html>
