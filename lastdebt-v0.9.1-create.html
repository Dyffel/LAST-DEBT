<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06132e"><title>LAST DEBT — Create Room</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050c22;color:white;font-family:system-ui,-apple-system,sans-serif}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;background:radial-gradient(#1a2654,#050c22);overflow:hidden}.poster{position:relative;height:100svh;min-height:560px;aspect-ratio:2/3;flex:none;box-shadow:0 0 65px #000}.poster img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}.tap{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.tap:focus-visible,.entry:focus-visible{outline:3px solid #fff;outline-offset:3px}.back{left:1%;top:0%;width:30%;height:7%}.entry{position:absolute;text-align:center;border:2px solid #67cfff;border-radius:10px;background:#041536eb;color:white;font-weight:900;text-shadow:0 0 9px #22aaff;outline:none;min-width:0}.action{position:absolute;border:0;border-radius:12px;cursor:pointer;background:#00441a11;color:transparent;touch-action:manipulation}.action:active{background:#ffffff44}.toast{position:fixed;bottom:10%;left:50%;transform:translateX(-50%);padding:13px 20px;border:2px solid #7fffd0;border-radius:15px;background:#08263f;color:white;z-index:30;font-weight:900;white-space:nowrap;box-shadow:0 0 22px #09f8bd88}.toast[hidden]{display:none}.note{position:absolute;text-align:center;color:white;background:#071a39ed;border:2px solid #68caff;border-radius:10px;font-weight:800;line-height:1.2}@media(max-height:560px){.screen{align-items:flex-start}}
</style></head><body><main class="screen"><div class="poster"><img src="lastdebt-create.webp" alt="LAST DEBT Create Room snowy illustrated screen"><a class="tap back" href="lastdebt-v0.9.1-online.html" aria-label="Back to Play Online"></a>
<div id="code" class="entry" style="left:27%;top:32.3%;width:35%;height:6%;display:grid;place-items:center;font-size:clamp(22px,6vh,44px);letter-spacing:.06em">------</div>
<button id="copy" class="tap" style="left:64%;top:31%;width:14%;height:9%" aria-label="Copy room code"></button>
<div id="playerLabel" class="note" style="left:36%;top:46%;width:29%;padding:5px;font-size:clamp(12px,2.4vh,18px)">PLAYERS (1/3)</div>
<div id="hostName" class="note" style="left:16%;top:62%;width:19%;padding:4px;font-size:clamp(11px,2.2vh,18px)">PLAYER</div>
<button id="ready" class="action" style="left:24%;top:74%;width:52%;height:9%" aria-label="Ready up"></button>
<div id="status" class="note" style="left:24%;top:84.5%;width:52%;padding:5px;font-size:clamp(11px,2vh,17px)">Tap READY UP when you're ready</div></div></main><div class="toast" id="toast" hidden></div><script>function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(window._tt);window._tt=setTimeout(()=>e.hidden=true,2600)}const name=localStorage.getItem('lastdebt-name')||'Player';document.getElementById('hostName').textContent=name;
// A locally generated demo code; no server is connected in this version.
let code=sessionStorage.getItem('lastdebt-room-code');if(!code){code=String(Math.floor(100000+Math.random()*900000));sessionStorage.setItem('lastdebt-room-code',code)}document.getElementById('code').textContent=code;
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);toast('❄ CODE COPIED!')}catch(e){toast('ROOM CODE: '+code)}};
let ready=false;document.getElementById('ready').onclick=()=>{ready=!ready;document.getElementById('status').textContent=ready?'✓ '+name+' READY · Waiting for 2 players…':'Tap READY UP when you’re ready';toast(ready?'☃️ YOU ARE READY!':'READY CANCELLED')};</script></body></html>
