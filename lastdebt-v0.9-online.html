<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06132e"><title>LAST DEBT — Play Online v0.8</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050c22;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#192858 0%,#050c22 75%);overflow:hidden}.poster{position:relative;flex:none;height:100svh;min-height:560px;aspect-ratio:2/3;box-shadow:0 0 70px #040716}.poster img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}.hit{position:absolute;display:block;border:0;border-radius:16px;cursor:pointer;background:transparent;color:transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.hit:focus-visible{outline:4px solid white;outline-offset:2px;background:#fff2}.hit:active{background:#fff3}.back{left:2%;top:1%;width:33%;height:6%}.create{left:9%;top:48%;width:40%;height:25%}.join{left:52%;top:48%;width:40%;height:25%}.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:10;background:#020717c9;display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px)}.panel{width:min(92vw,420px);padding:30px 24px;text-align:center;border:2px solid #79d6ff;border-radius:20px;background:linear-gradient(150deg,#142955,#080f27);box-shadow:0 0 40px #2799ff80}.panel.green{border-color:#6dff9c;box-shadow:0 0 40px #16c46c77}.panel.purple{border-color:#cb83ff;box-shadow:0 0 40px #9b48fa77}.panel h2{margin:0 0 12px;font-size:27px}.panel p{line-height:1.5;color:#dceaff}.close{margin-top:12px;padding:13px 28px;border:2px solid #8ae8ff;border-radius:12px;background:#07316b;color:#fff;font-weight:900;font-size:16px;cursor:pointer}@media(max-height:560px){.screen{align-items:flex-start}}
</style></head><body><main class="screen"><div class="poster"><img src="lastdebt-online.webp" alt="LAST DEBT Play Online: choose Create Game or Join Game in a snowy winter scene" fetchpriority="high"><a class="hit back" href="lastdebt-v0.9.html" aria-label="Back to main menu"></a><button class="hit create" aria-label="Create Game" data-mode="create"></button><button class="hit join" aria-label="Join Game" data-mode="join"></button></div></main>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="panel green" id="panel"><h2 id="modalTitle">☃️ YOUR SNOWMAN NAME</h2><p>What should your friends call you?</p><form id="nameForm"><input id="playerName" maxlength="16" autocomplete="nickname" placeholder="e.g. Noel" required style="width:100%;padding:16px;border:2px solid #7ad6ff;border-radius:13px;background:#06172e;color:white;font-size:18px"><button class="close" type="submit" style="background:#09a85b;border-color:#7effa4">CREATE ROOM ❄</button></form><button class="close" id="close" type="button">CANCEL</button></div></div><script>
const modal=document.getElementById('modal');let previous=null;
document.querySelector('[data-mode="create"]').addEventListener('click',e=>{previous=e.currentTarget;modal.hidden=false;document.getElementById('playerName').value=localStorage.getItem('lastdebt-name')||'';document.getElementById('playerName').focus()});
document.querySelector('[data-mode="join"]').addEventListener('click',()=>location.href='lastdebt-v0.9-join.html');
function dismiss(){modal.hidden=true;previous?.focus()}document.getElementById('close').onclick=dismiss;modal.addEventListener('click',e=>{if(e.target===modal)dismiss()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)dismiss()});
document.getElementById('nameForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('playerName').value.trim();if(!name)return;localStorage.setItem('lastdebt-name',name);location.href='lastdebt-v0.9-create.html'});
</script></body></html>
